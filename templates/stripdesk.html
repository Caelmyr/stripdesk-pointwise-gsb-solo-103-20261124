<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>StripDesk · 底片数字化</title>
<link rel="stylesheet" href="{{ url_for('static', filename='stripdesk.css') }}">
<script defer src="{{ url_for('static', filename='stripdesk.js') }}"></script>
</head>
<body>
<header class="bar"><a class="brand" href="/"><span class="mark" aria-hidden="true">▦</span>StripDesk</a><span class="subtitle">底片数字化工作台</span><a class="prepare" href="/prepare">照片准备 ↗</a></header>
<main>
<section class="heading"><div><h1>底片扫描</h1><p>从水平片条量导线、转正并归档。</p></div><form id="upload"><label class="choose">导入扫描<input name="image" id="upload-file" type="file" accept="image/png,image/jpeg,image/tiff,image/bmp,image/webp" required></label><button type="submit" class="primary">上传</button><button id="demo" type="button">载入合成练习条</button></form></section>
<div id="status" role="status" aria-live="polite"></div>
<div class="workbench">
<aside class="library"><h2>片条</h2><div id="library"></div></aside>
<section class="mainpanel">
<div id="blank"><h2>打开一条底片</h2><p>选择左侧片条，或先导入水平扫描。</p></div>
<section id="desk" hidden>
<header class="deskhead"><div><h2 id="strip-name"></h2><span id="strip-meta"></span></div><button id="save-run" class="primary" type="button">保存出片</button></header>
<div class="strip-window"><div id="scan"><img id="source" alt="片条原始扫描"><div id="guides" aria-hidden="true"></div></div></div>
<div class="profile-row"><canvas id="profile" width="900" height="105" aria-label="选定高度内每列的暗像素比例"></canvas><div><strong>纵向暗带</strong><p id="bands"></p></div></div>
<div class="edit-area">
<form id="settings" class="settings">
<h3>导线与成片</h3>
<div class="inputs">
<label>起点 X <input type="number" name="origin" required min="0"></label>
<label>统一帧距 <input type="number" name="pitch" required min="8"></label>
<label>张数 <input type="number" name="count" required min="1" max="24"></label>
<label>首张片号 <input type="number" name="first" required min="1"></label>
<label>上边 Y <input type="number" name="top" required min="0"></label>
<label>下边 Y <input type="number" name="bottom" required min="8"></label>
<label>暗值上限 <input type="number" name="dark_level" required min="1" max="254"></label>
<label>暗像素比例 <input type="number" name="dark_share" required min="0.1" max="1" step="0.01"></label>
<label>成片比例 <select name="ratio"><option value="native">原画幅</option><option>3:2</option><option>4:3</option><option>1:1</option><option>2:3</option></select></label>
<label class="checkbox">负片转正 <input type="checkbox" name="negative"></label>
</div>
<div class="base"><label>片基 R<input type="number" name="red" required min="8" max="255"></label><label>G<input type="number" name="green" required min="8" max="255"></label><label>B<input type="number" name="blue" required min="8" max="255"></label></div>
<div class="setting-action"><button class="primary" type="submit">应用设置</button><button id="use-base" type="button" disabled>取点作片基</button></div>
<p id="probe">在扫描图上点选像素，核对原色和转正颜色。</p>
</form>
<section class="preview"><header><h3>成片预览</h3><button id="sheet-toggle" type="button">查看样片板</button></header>
<div id="frame-buttons" class="frame-buttons"></div>
<img id="frame-image" alt="所选片号的成片图">
<p id="frame-reading"></p>
<button id="transfer" type="button">送往照片准备 ↗</button>
</section>
</div>
<section class="records"><h3>出片记录</h3><div id="runs"></div></section>
</section>
</section>
</div>
</main>
</body>
</html>
