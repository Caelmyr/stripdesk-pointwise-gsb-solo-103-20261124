name: solo106-stripdesk
services:
  desk:
    build:
      context: .
      args:
        STRIP_RUNTIME_IMAGE: ${STRIP_RUNTIME_IMAGE:-python:3.12-slim}
    image: ${STRIP_IMAGE:-solo106-stripdesk:1.0}
    network_mode: bridge
    environment:
      OPENBLAS_NUM_THREADS: 1
      OMP_NUM_THREADS: 1
    ports:
      - "127.0.0.1:${STRIP_PORT:-19906}:8000"
    volumes:
      - strip-data:/var/lib/stripdesk
    healthcheck:
      test: ["CMD", "python", "-B", "-c", "from urllib.request import urlopen; assert urlopen('http://127.0.0.1:8000/strip/health', timeout=3).status==200"]
      interval: 3s
      timeout: 4s
      retries: 12
volumes:
  strip-data:
